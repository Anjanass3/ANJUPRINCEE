<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA85"/>
      <stop offset="50%" stop-color="#C5A02E"/>
      <stop offset="100%" stop-color="#836219"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2D392B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#435842"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <!-- Ornate Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical beam -->
    <path d="M50 18 L50 82 M50 24 L50 28 M50 72 L50 76" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Horizontal beam -->
    <path d="M28 38 L72 38" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Decorative center ring -->
    <circle cx="50" cy="38" r="7" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="50" cy="38" r="2.5" fill="#FAF8F2"/>
    <!-- Budded cross tips -->
    <circle cx="50" cy="18" r="3.5" fill="url(#gold)"/>
    <circle cx="50" cy="82" r="3.5" fill="url(#gold)"/>
    <circle cx="28" cy="38" r="3.5" fill="url(#gold)"/>
    <circle cx="72" cy="38" r="3.5" fill="url(#gold)"/>
  </g>
</svg>